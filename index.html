  };

  const handleDemoLogin = (user) => {
    setUsername(user.username);
    setPassword(user.password);
    setShowDemoDrawer(false);
    
    // Auto-submit with slight delay so user sees credentials filled
    setIsLoading(true);
    setTimeout(() => {
      let matchedUser = { 
        username: user.username, 
        name: user.name, 
        role: user.role, 
        avatar: user.username === 'engineer' ? 'SJ' : 'DC' 
      };
      setIsLoading(false);
      if (rememberMe) {
        localStorage.setItem('reverse_bim_user', JSON.stringify(matchedUser));
      }
      onLogin(matchedUser);
    }, 800);
  };

  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-logo">
          <span className="logo-badge">10xDS</span>
          <h2>Reverse BIM</h2>
          <p>AI-Powered Engineering Estimation</p>
        </div>

        {error && (
          <div className="login-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span style={{ marginLeft: '8px' }}>{error}</span>
          </div>
        )}

        <form onSubmit={handleLogin}>
          <div className="form-group">
            <label htmlFor="username">Username</label>
            <div className="input-wrapper">
              <span className="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input
                id="username"
                type="text"
                className="form-input"
                placeholder="Enter username"
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                disabled={isLoading}
              />
            </div>
          </div>

          <div className="form-group">
            <label htmlFor="password">Password</label>
            <div className="input-wrapper">
              <span className="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                id="password"
                type={showPassword ? 'text' : 'password'}
                className="form-input"
                placeholder="Enter password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                disabled={isLoading}
              />
              <button
                type="button"
                className="pwd-toggle"
                onClick={() => setShowPassword(!showPassword)}
                disabled={isLoading}
              >
                {showPassword ? (
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                ) : (
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                )}
              </button>
            </div>
          </div>

          <div className="form-options">
            <label className="remember-me">
              <input
                type="checkbox"
                checked={rememberMe}
                onChange={(e) => setRememberMe(e.target.checked)}
                disabled={isLoading}
              />
              Remember Me
            </label>
            <a href="#" className="forgot-pwd" onClick={(e) => { e.preventDefault(); alert("Please contact your administrator to reset password."); }}>
              Forgot Password?
            </a>
          </div>

          <button type="submit" className="btn-login" disabled={isLoading}>
            {isLoading ? (
              <>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{animation: 'spin 1s linear infinite', marginRight: '8px'}}><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                Authenticating...
              </>
            ) : (
              'Sign In'
            )}
          </button>
        </form>
      </div>

      <button className="demo-trigger" onClick={() => setShowDemoDrawer(!showDemoDrawer)}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span style={{ marginLeft: '6px' }}>Demo Accounts</span>
      </button>

      {showDemoDrawer && (
        <div className="demo-drawer">
          <div className="demo-drawer-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{marginRight: '6px'}}><polygon points="12 2 15 8 21 12 15 16 12 22 9 16 3 12 9 8 12 2"/></svg>
            Select Demo Account
          </div>
          {demoUsers.map((user, idx) => (
            <div key={idx} className="demo-user-card">
              <div className="demo-user-role">{user.role}</div>
              <div className="demo-user-info">
                User: <span>{user.username}</span> | Pass: <span>{user.password}</span>
              </div>
              <div style={{fontSize: '11px', color: '#64748b', marginBottom: '8px', lineHeight: 1.3}}>
                {user.desc}
              </div>
              <button 
                className="btn-demo-login" 
                onClick={() => handleDemoLogin(user)}
                disabled={isLoading}
              >
                Auto-Fill & Sign In
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════
function App() {
  const [currentUser, setCurrentUser] = useState(() => {
    const saved = localStorage.getItem('reverse_bim_user');
    return saved ? JSON.parse(saved) : null;
  });
  const [activePage, setActivePage] = useState('inbox');
  const [prevPage, setPrevPage] = useState('inbox');
  const [fadeClass, setFadeClass] = useState('fade-active');
  const [enquiries, setEnquiries] = useState(initialEnquiries);
  const [selectedEnquiry, setSelectedEnquiry] = useState(initialEnquiries.length > 0 ? initialEnquiries[0].name : '');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  const toggleSidebar = () => {
    setSidebarCollapsed(prev => !prev);
  };

  const handleAddEnquiry = (name) => {
    setEnquiries([...enquiries, { name, files: [] }]);
    setSelectedEnquiry(name);
  };

  const handleAddEnquiryWithFiles = (name, files) => {
    setEnquiries(prev => {
      const exists = prev.some(e => e.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        return prev.map(e => e.name.toLowerCase() === name.toLowerCase() ? { ...e, files: [...e.files, ...files] } : e);
      }
      return [...prev, { name, files }];
    });
  };

  const handleNav = (id) => {
    let target = id;
    if (id === 'toggleSettings') {
      target = activePage === 'settings' ? (prevPage || 'inbox') : 'settings';
    }
    if (target === activePage) return;

    if (target === 'settings' && activePage !== 'settings') {
      setPrevPage(activePage);
    }

    setFadeClass('fade-enter');
    setTimeout(() => {
      setActivePage(target);
      setFadeClass('fade-active');
    }, 150);
  };

  const renderPage = () => {
    switch (activePage) {
      case 'inbox': return <TenderInbox enquiries={enquiries} onAddEnquiryWithFiles={handleAddEnquiryWithFiles} onNav={handleNav} />;
      case 'rfq': return <RFQIngestion enquiries={enquiries} selectedEnquiry={selectedEnquiry} setSelectedEnquiry={setSelectedEnquiry} />;
      case 'drawing': return <DrawingExtraction selectedEnquiry={selectedEnquiry} />;
      case 'explorer': return <ObjectExplorer enquiries={enquiries} selectedEnquiry={selectedEnquiry} />;
      case 'estimator': return <EstimatorWorkbench selectedEnquiry={selectedEnquiry} />;
      case 'revision': return <RevisionImpact selectedEnquiry={selectedEnquiry} />;
      case 'dashboard': return <Dashboard />;
      case 'settings': return <SettingsPage enquiries={enquiries} onAddEnquiry={handleAddEnquiry} />;
      default: return <TenderInbox enquiries={enquiries} onAddEnquiryWithFiles={handleAddEnquiryWithFiles} onNav={handleNav} />;
    }
  };

  if (!currentUser) {
    return <LoginPage onLogin={setCurrentUser} />;
  }

  return (
    <>
      <Sidebar 
        active={activePage} 
        onNav={handleNav} 
        collapsed={sidebarCollapsed} 
        onToggle={toggleSidebar} 
        user={currentUser}
        onLogout={() => {
          localStorage.removeItem('reverse_bim_user');
          setCurrentUser(null);
        }}
      />
      <div className={`main-area${sidebarCollapsed ? ' sidebar-collapsed' : ''}`}>
        <TopBar 
          page={activePage} 
          onNav={handleNav} 
          user={currentUser}
          enquiries={enquiries}
          selectedEnquiry={selectedEnquiry}
          onSelectEnquiry={setSelectedEnquiry}
        />
        <div className={`content ${fadeClass}`}>
          {renderPage()}
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>
</body>
</html>
